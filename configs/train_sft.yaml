model_name: Qwen/Qwen2.5-Coder-7B-Instruct
load_in_4bit: true   # QLoRA - fits on single 24GB GPU
bf16: true
seq_len: 1024        # Reduced for memory
lr: 2.0e-4           # Higher LR for QLoRA
epochs: 2
per_device_batch: 2
grad_accum: 16       # Effective batch = 32
dataloader_workers: 4
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
data:
  train_jsonl: data/sft/train.jsonl
  val_jsonl: data/sft/val.jsonl
